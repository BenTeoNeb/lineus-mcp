[project]
name = "lineus-core"
version = "0.1.0"
description = "The Line-us robot arm as measured: its reach, pen depth, coordinate mapping and connection. Shared by lineus-mcp and lineus-jog."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Benjamin Farcy" }]
keywords = ["line-us", "pen-plotter"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Repository = "https://github.com/BenTeoNeb/lineus-mcp"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lineus_core"]
