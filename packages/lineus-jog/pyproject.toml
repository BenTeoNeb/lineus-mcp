[project]
name = "lineus-jog"
version = "0.1.0"
description = "Drive a Line-us robot arm by hand, live, from the keyboard, the mouse or a gamepad -- and calibrate the pen while you do."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Benjamin Farcy" }]
keywords = ["line-us", "pen-plotter", "gamepad", "jog"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Artistic Software",
]
dependencies = [
  "lineus-core",
  "pygame-ce>=2.5",
]

[project.urls]
Repository = "https://github.com/BenTeoNeb/lineus-mcp"

[project.scripts]
lineus-jog = "lineus_jog.app:main"

[tool.uv.sources]
lineus-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lineus_jog"]
