# A uv workspace: the arm (lineus-core) and the two ways to drive it -- an agent through
# MCP (lineus-mcp) and a person at a keyboard or gamepad (lineus-jog).
[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["packages/lineus-core/tests", "packages/lineus-mcp/tests", "packages/lineus-jog/tests"]

[tool.ruff]
line-length = 100
src = ["packages/lineus-core/src", "packages/lineus-mcp/src", "packages/lineus-jog/src", "."]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = [
  "E701", "E702",   # short one-line statements are used deliberately for compact geometry
  "E731",           # small lambdas as local helpers
  "B905",           # zip(s, s[1:]) is the pairwise idiom: unequal lengths are the point
]

[tool.ruff.lint.isort]
known-first-party = ["lineus_core", "lineus_mcp", "lineus_jog", "conftest"]

[tool.ruff.lint.per-file-ignores]
"packages/lineus-mcp/examples/*" = ["E", "B"]
